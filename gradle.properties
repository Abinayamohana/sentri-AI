# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Where the app downloads model files from. This file is tracked in git, so put ONLY the URL
# here — the Hugging Face token belongs in local.properties as hfToken. See MODELS.md.
# modelBaseUrl=https://your-storage.example.com/sentriai-models
# The Agora RTC AARs (voice-sdk and the audio extensions it pulls in) all declare the same
# `io.agora.rtc` namespace. AGP 9 treats that as an error rather than a warning, and it is not
# something this project can fix — it is baked into the published artifacts. Nothing here shares
# a namespace with them, so the check has nothing to protect.
android.uniquePackageNames=false

# Prevent Gradle toolchain auto-detection from selecting stripped JREs (e.g., Red Hat Java extension JRE missing jlink)
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.paths=/Applications/Android Studio.app/Contents/jbr/Contents/Home,/opt/homebrew/Cellar/openjdk@17/17.0.15/libexec/openjdk.jdk/Contents/Home
org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home


